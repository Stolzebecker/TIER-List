<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Rangreihenverfahren – Fernerkundungsbilder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <nav id="level-bar" class="level-bar" aria-label="Level-Auswahl"></nav>
    <div class="legend">
      <span class="legend-text">Bild auswählen, dann Zielposition anklicken</span>
      <span class="legend-tag legend-tag--easy">einfach</span>
      <span class="legend-gradient" aria-hidden="true"></span>
      <span class="legend-tag legend-tag--hard">komplex</span>
    </div>
  </header>

  <div class="layout">
    <section class="ranking-zone" aria-label="Rangreihenfolge, Rang 1 = einfach, Rang 12 = komplex">
      <div class="ranking-label" aria-hidden="true">Rangreihenfolge</div>
      <div id="ranking-track" class="track track--ranking" data-zone="ranking"></div>
    </section>

    <div class="resizer" id="resizer-1" role="separator" aria-orientation="vertical"
         aria-label="Breite der Rangreihenfolge-Spalte anpassen" tabindex="0"></div>

    <main class="pool-zone" aria-label="Bilder-Pool">
      <div id="pool-track" class="track track--pool" data-zone="pool"></div>
    </main>

    <div class="resizer" id="resizer-2" role="separator" aria-orientation="vertical"
         aria-label="Breite der Kommentare-Spalte anpassen" tabindex="0"></div>

    <aside class="comments-zone">
      <h2>Kommentare</h2>

      <div class="comment-block">
        <label for="general-comment">Allgemeiner Kommentar</label>
        <textarea id="general-comment" placeholder="Anmerkungen zur gesamten Rangreihe..."></textarea>
      </div>

      <div class="comment-block">
        <label id="active-image-label">Bildkommentar – kein Bild ausgewählt</label>
        <textarea id="image-comment" placeholder="Bild anklicken, um hier einen Kommentar zu hinterlassen..." disabled></textarea>
      </div>

      <button id="submit-btn" type="button" disabled>Bewertung abschließen</button>
      <p id="status-msg" class="status" role="status"></p>
    </aside>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <img id="lightbox-img" src="" alt="">
  <button id="lightbox-close" type="button" aria-label="Schließen">&times;</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
